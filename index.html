<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plataforma de Procedimientos</title>
<style>
  :root {
    color-scheme: light;
    --azul: #3FA9E0;
    --azul-osc: #1F7FB3;
    --azul-cl: #E7F5FC;
    --naranja: #F07D1E;
    --naranja-osc: #D2650A;
    --naranja-cl: #FDEAD3;
    --crema: #FDF6E4;
    --crema-osc: #F7ECC9;
    --verde: #1a7f4e;
    --verde-cl: #e6f6ee;
    --rojo: #b3261e;
    --rojo-cl: #fbe9e7;
    --gris: #6b6154;
    --gris-cl: #F8F1DE;
    --borde: #EADFBC;
    --tinta: #23201A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--crema);
    color: var(--tinta);
    font-size: 14.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-osc) 100%);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 4px solid var(--naranja);
    box-shadow: 0 2px 12px rgba(35,32,26,0.15);
  }
  header .brand { display: flex; align-items: center; gap: 12px; }
  .brand-badge {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--tinta); color: var(--crema);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; letter-spacing: .02em;
    border: 2px solid var(--naranja);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px; margin: 0; font-weight: 800;
    text-transform: uppercase; letter-spacing: .02em;
  }
  header .sub { font-size: 12px; opacity: 0.92; margin-top: 2px; font-weight: 600; }
  #userBox { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  #userBox .pill {
    background: rgba(255,255,255,0.18);
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: 600;
  }
  button {
    cursor: pointer;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    font-size: 13px;
    font-weight: 700;
    transition: background .15s ease, transform .05s ease, box-shadow .15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--naranja); color: #fff; box-shadow: 0 2px 6px rgba(240,125,30,0.35); }
  .btn-primary:hover { background: var(--naranja-osc); box-shadow: 0 3px 10px rgba(240,125,30,0.4); }
  .btn-secondary { background: #fff; color: var(--azul-osc); border: 2px solid var(--azul); }
  .btn-secondary:hover { background: var(--azul-cl); }
  .btn-ghost { background: transparent; color: var(--gris); border: 2px solid var(--borde); }
  .btn-ghost:hover { background: var(--gris-cl); }
  .btn-danger { background: var(--rojo); color: #fff; }
  nav {
    display: flex;
    gap: 4px;
    background: #fff;
    border-bottom: 2px solid var(--borde);
    padding: 0 18px;
    flex-wrap: wrap;
  }
  nav button.tab {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    padding: 14px 16px;
    color: var(--gris);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: .03em;
    transition: color .15s ease, border-color .15s ease;
  }
  nav button.tab:hover { color: var(--azul-osc); }
  nav button.tab.active { color: var(--naranja-osc); border-bottom-color: var(--naranja); }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .hidden { display: none !important; }
  .card {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    border-top: 4px solid var(--azul);
    box-shadow: 0 1px 3px rgba(35,32,26,0.04), 0 6px 18px rgba(35,32,26,0.06);
  }
  .card h2 {
    font-size: 15.5px; margin: 0 0 14px 0; text-transform: uppercase;
    letter-spacing: .03em; font-weight: 800; color: var(--tinta);
  }
  .card h3 { font-size: 14px; margin: 0 0 8px 0; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--gris); margin: 10px 0 4px; }
  input[type=text], input[type=date], textarea, select, input[type=file] {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
    background: #fffdf8;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul); }
  textarea { resize: vertical; min-height: 80px; }
  .proc-item {
    border: 1.5px solid var(--borde);
    border-radius: 12px;
    padding: 15px 17px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    flex-wrap: wrap;
    background: #fffdf8;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .proc-item:hover { box-shadow: 0 4px 14px rgba(35,32,26,0.08); border-color: var(--azul); }
  .proc-item .info { flex: 1; min-width: 220px; }
  .proc-item h3 { margin: 0 0 4px 0; font-size: 14.5px; }
  .meta { font-size: 12px; color: var(--gris); }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 20px;
    margin-left: 6px;
    text-transform: uppercase;
  }
  .badge.ok { background: var(--verde-cl); color: var(--verde); }
  .badge.pend { background: var(--naranja-cl); color: var(--naranja-osc); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); }
  th { color: var(--gris); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }
  tr:hover td { background: var(--gris-cl); }
  .empty { color: var(--gris); font-size: 13px; padding: 20px; text-align: center; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(35,32,26,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal {
    background: #fffdf8; border-radius: 16px; padding: 24px; width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; border-top: 6px solid var(--naranja);
    box-shadow: 0 24px 60px rgba(35,32,26,0.35);
  }
  .modal h2 { margin-top: 0; font-size: 16px; text-transform: uppercase; font-weight: 800; letter-spacing: .02em; }
  canvas#sigPad {
    border: 2px dashed var(--azul);
    border-radius: 10px;
    width: 100%;
    height: 160px;
    touch-action: none;
    background: #fffefa;
  }
  .row-end { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .checklist { font-size: 13px; }
  .checklist label { display: flex; align-items: flex-start; gap: 8px; font-weight: 400; color: var(--tinta); }
  .checklist input { width: auto; margin-top: 3px; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag {
    background: var(--azul-cl); color: var(--azul-osc); font-size: 11.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
  }
  .tag button { background: none; padding: 0; font-size: 13px; color: var(--azul-osc); }
  .sig-thumb { height: 34px; border: 1.5px solid var(--borde); border-radius: 6px; background: #fff; cursor: pointer; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { width: auto; }
  .note { font-size: 12px; color: var(--gris); margin-top: 6px; }
  .stat { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .stat .box { background: var(--gris-cl); border-radius: 10px; padding: 10px 16px; text-align: center; min-width: 90px; border: 1px solid var(--borde); }
  .stat .box b { display: block; font-size: 20px; color: var(--naranja-osc); }
  .stat .box span { font-size: 11px; color: var(--gris); text-transform: uppercase; }
  #areaImprimir { display: none; }
  @media print {
    body * { visibility: hidden; }
    #areaImprimir, #areaImprimir * { visibility: visible; }
    #areaImprimir { display: block; position: absolute; left: 0; top: 0; width: 100%; }
  }
</style>
</head>

  <div class="brand">
    <div class="brand-badge">BBC</div>
    <div>
      <h1>Plataforma de Procedimientos</h1>
    </div>
  </div>
  <div id="userBox"></div>
</header>

<nav id="tabs"></nav>

<main id="main"></main>

<div id="modalRoot"></div>

function loadProcs(){ return JSON.parse(localStorage.getItem(LS_PROCS) || "[]"); }
function saveProcs(d){ localStorage.setItem(LS_PROCS, JSON.stringify(d)); }
function loadSigs(){ return JSON.parse(localStorage.getItem(LS_SIGS) || "[]"); }
function saveSigs(d){ localStorage.setItem(LS_SIGS, JSON.stringify(d)); }
function loadUser(){ return JSON.parse(localStorage.getItem(LS_USER) || "null"); }
function saveUser(u){ localStorage.setItem(LS_USER, JSON.stringify(u)); }
function loadComentarios(){ return JSON.parse(localStorage.getItem(LS_COMENTARIOS) || "[]"); }
function saveComentarios(d){ localStorage.setItem(LS_COMENTARIOS, JSON.stringify(d)); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-CO', {year:'numeric', month:'short', day:'2-digit'}) + ' ' +
         d.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
}

/* ---------- Estado ---------- */
let state = {
  tab: "procedimientos",
  user: loadUser()
};

const ROLES = ["Administrador (Inventarios)", "Gerente de Punto de Venta", "Coordinador de Zona"];

const PUNTOS_VENTA = [
  "Todos (coordinadores / otros)",
  "PUB ANDINO", "PUB AVDA 19", "PUB PARQUE 93", "PUB USAQUEN", "PUB CEDRITOS",
  "PUB CALLE 85", "PUB ROSALES", "PUB PEPE SIERRA", "PUB BELAIRE", "PUB COLINA",
  "PUB CALLE 63", "PUB SALITRE", "PUB CANDELARIA", "PUB TITAN", "PUB GALERIAS",
  "PUB SAN MARTIN", "PUB CENTRO MAYOR", "PUB PLAZA DE LAS AMERICAS", "PUB PLAZA CENTRAL",
  "PUB CONECTA", "PUB BBC MOVISTAR ARENA"
];

const TIPOS_DOC = ["Cédula de ciudadanía", "Cédula de extranjería", "Tarjeta de identidad", "Pasaporte"];

/* ---------- Render raíz ---------- */
function render(){
  renderUserBox();
  renderTabs();
  renderMain();
}

function isAdmin(){ return state.user && state.user.rol === ROLES[0]; }

/* ---------- Barra de usuario ---------- */
function renderUserBox(){
  const box = document.getElementById('userBox');
  if (!state.user) {
    box.innerHTML = `<button class="btn-secondary" onclick="openLogin()" style="background:#fff;">Identificarme</button>`;
    return;
  }
  const u = state.user;
  box.innerHTML = `
    <span class="pill">${escapeHtml(u.nombre)} · ${escapeHtml(u.rol)}${u.puntoVenta ? ' · '+escapeHtml(u.puntoVenta) : ''}</span>
    <button class="btn-ghost" style="background:transparent;color:#fff;border-color:rgba(255,255,255,0.5);" onclick="cerrarSesion()">Salir</button>
  `;
}

function openLogin(tab){
  tab = tab || 'usuario';
  showModal(`
    <h2>Ingresar</h2>
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <button type="button" class="${tab==='usuario' ? 'btn-primary' : 'btn-ghost'}" onclick="openLogin('usuario')">Usuario / Lector</button>
      <button type="button" class="${tab==='admin' ? 'btn-primary' : 'btn-ghost'}" onclick="openLogin('admin')">Administrador</button>
    </div>
    ${tab === 'usuario' ? `
      <label>Nombre completo</label>
      <input type="text" id="loginNombreUsuario" placeholder="Ej: Ana María Rojas" onkeydown="if(event.key==='Enter'){event.preventDefault(); submitLoginUsuario();}">
      <p class="note">El resto de tus datos (documento, cargo, punto de venta) los completas al momento de firmar el recibido de un procedimiento.</p>
      <div class="row-end">
        <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" onclick="submitLoginUsuario()">Entrar</button>
      </div>
    ` : `
      <label>Clave de administrador</label>
      <input type="text" id="loginClaveAdmin" placeholder="Clave" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault(); submitLoginAdmin();}">
      <div class="row-end">
        <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" onclick="submitLoginAdmin()">Entrar</button>
      </div>
    `}
  `);
}

function submitLoginUsuario(){
  const nombre = document.getElementById('loginNombreUsuario').value.trim();
  if (!nombre){ alert("Escribe tu nombre."); return; }
  state.user = { nombre, rol: "Usuario / Lector", cargo:"", puntoVenta:"", tipoDoc:"", numDoc:"" };
  saveUser(state.user);
  closeModal();
  render();
}

function submitLoginAdmin(){
  const clave = document.getElementById('loginClaveAdmin').value.trim();
  if (clave !== ADMIN_CLAVE){ alert("Clave incorrecta."); return; }
  state.user = { nombre: "Administrador Inventarios", rol: ROLES[0], cargo: "Inventarios", puntoVenta: "Todos (coordinadores / otros)", tipoDoc:"", numDoc:"" };
  saveUser(state.user);
  closeModal();
  render();
}

function cerrarSesion(){
  state.user = null;
  saveUser(null);
  render();
}

/* ---------- Pestañas ---------- */
function tabsFor(){
  if (!state.user) return [["procedimientos","Procedimientos"]];
  if (isAdmin()) return [
    ["procedimientos","Procedimientos"],
    ["nuevo","Publicar procedimiento"],
    ["cumplimiento","Cumplimiento"],
    ["historial","Historial de firmas"],
    ["comentarios","Dudas"]
  ];
  return [
    ["procedimientos","Procedimientos"],
    ["misfirmas","Mis firmas"]
  ];
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  const tabs = tabsFor();
  if (!tabs.find(t => t[0] === state.tab)) state.tab = tabs[0][0];
  nav.innerHTML = tabs.map(([key,label]) =>
    `<button class="tab ${state.tab===key?'active':''}" onclick="setTab('${key}')">${label}</button>`
  ).join('');
}

function setTab(t){ state.tab = t; renderMain(); renderTabs(); }

/* ---------- Main ---------- */
function renderMain(){
  const main = document.getElementById('main');
  if (state.tab === "procedimientos") return main.innerHTML = viewProcedimientos();
  if (state.tab === "nuevo") return main.innerHTML = viewNuevo();
  if (state.tab === "cumplimiento") return main.innerHTML = viewCumplimiento();
  if (state.tab === "historial") return main.innerHTML = viewHistorial();
  if (state.tab === "misfirmas") return main.innerHTML = viewMisFirmas();
  if (state.tab === "comentarios") return main.innerHTML = viewComentarios();
}

/* ---------- Vista: Procedimientos ---------- */
function viewProcedimientos(){
  const procs = loadProcs();
  const sigs = loadSigs();
  if (procs.length === 0) return `<div class="card"><div class="empty">Aún no hay procedimientos publicados.</div></div>`;

  const coments = loadComentarios();
  const items = procs.map(p => {
    const yaFirmo = state.user && sigs.some(s => s.procedureId === p.id &&
      s.nombre.toLowerCase() === state.user.nombre.toLowerCase());
    const numComentarios = coments.filter(c => c.procedureId === p.id).length;
    return `
      <div class="proc-item">
        <div class="info">
          <h3>${escapeHtml(p.titulo)} <span class="badge ${yaFirmo ? 'ok':'pend'}">${yaFirmo ? 'Firmado' : 'Pendiente de firma'}</span></h3>
          <div class="meta">${escapeHtml(p.categoria)} · v${escapeHtml(p.version)}${p.fechaDocumento ? ' · Doc. '+p.fechaDocumento : ''} · Publicado ${fmtDate(p.fechaPublicacion)} · por ${escapeHtml(p.publicadoPor)}${numComentarios ? ' · 💬 '+numComentarios+' duda'+(numComentarios>1?'s':'') : ''}</div>
        </div>
        <div class="actions">
          <button class="btn-secondary" onclick="openLeer('${p.id}')">Leer</button>
          ${(isAdmin() || yaFirmo)
            ? `<button class="btn-ghost" onclick="descargarProc('${p.id}')">Descargar</button>`
            : `<button class="btn-ghost" disabled style="opacity:.5;cursor:default;" title="Primero lee y firma el recibido">Descargar</button>`}
          ${state.user && !isAdmin() ? `<button class="btn-primary" ${yaFirmo?'disabled style="opacity:.5;cursor:default;"':''} onclick="openFirmar('${p.id}')">${yaFirmo?'Ya firmado':'Firmar recibido'}</button>` : ''}
          ${isAdmin() ? `<button class="btn-ghost" style="color:var(--rojo);" onclick="eliminarProc('${p.id}')">Eliminar</button>` : ''}
        </div>
      </div>`;
  }).join('');

  return `<div class="card"><h2>Procedimientos publicados</h2>${items}</div>`;
}

function eliminarProc(id){
  const p = loadProcs().find(x => x.id === id);
  if (!p) return;
  if (!confirm(`¿Eliminar "${p.titulo}"? También se perderán sus firmas, dudas y comentarios asociados. Esta acción no se puede deshacer.`)) return;
  saveProcs(loadProcs().filter(x => x.id !== id));
  saveSigs(loadSigs().filter(x => x.procedureId !== id));
  saveComentarios(loadComentarios().filter(x => x.procedureId !== id));
  renderMain();
}

function openLeer(id){
  const p = loadProcs().find(x => x.id === id);
  const sigs = loadSigs();
  const yaFirmo = state.user && sigs.some(s => s.procedureId === p.id &&
    s.nombre.toLowerCase() === state.user.nombre.toLowerCase());
  const puedeDescargar = isAdmin() || yaFirmo;
  const esPDF = !!(p.archivoNombre && /\.pdf$/i.test(p.archivoNombre) && p.archivoDataURL);
  showModal(`
    <h2>${escapeHtml(p.titulo)}</h2>
    <p class="meta">${escapeHtml(p.categoria)} · v${escapeHtml(p.version)}${p.fechaDocumento ? ' · Fecha del documento: '+p.fechaDocumento : ''} · Publicado ${fmtDate(p.fechaPublicacion)}${p.vigenciaHasta ? ' · Vigente hasta '+p.vigenciaHasta : ''}</p>
    ${p.contenido ? `<div style="white-space:pre-wrap; border:1px solid var(--borde); border-radius:8px; padding:12px; max-height:260px; overflow-y:auto; font-size:13.5px;">${escapeHtml(p.contenido)}</div>` : (!esPDF ? `<p class="note">(Sin contenido de texto — ver archivo adjunto o enlace)</p>` : '')}
    ${esPDF ? `
      <p class="note" style="margin-top:10px;">Archivo adjunto: ${escapeHtml(p.archivoNombre)}</p>
      <iframe src="${p.archivoDataURL}" style="width:100%; height:60vh; min-height:420px; border:1.5px solid var(--borde); border-radius:8px; margin-top:6px;"></iframe>
    ` : ''}
    ${(p.archivoNombre && !esPDF) ? `<p class="note">Archivo adjunto: ${escapeHtml(p.archivoNombre)} (este tipo de archivo no se puede previsualizar aquí — descárgalo para verlo).</p>` : ''}
    ${p.urlExterno ? `<p class="note">Enlace al documento original: <a href="${escapeAttr(p.urlExterno)}" target="_blank">${escapeHtml(p.urlExterno)}</a></p>` : ''}
    ${!puedeDescargar ? `<p class="note">La descarga se habilita después de firmar el recibido.</p>` : ''}
    <div class="row-end">
      <button class="btn-ghost" onclick="closeModal()">Cerrar</button>
      ${puedeDescargar
        ? `<button class="btn-secondary" onclick="descargarProc('${p.id}')">Descargar</button>`
        : `<button class="btn-secondary" disabled style="opacity:.5;cursor:default;" title="Primero lee y firma el recibido">Descargar</button>`}
      ${state.user && !isAdmin() && !yaFirmo ? `<button class="btn-primary" onclick="closeModal(); openFirmar('${p.id}')">Firmar recibido</button>` : ''}
    </div>
    <hr style="border:none;border-top:1px solid var(--borde);margin:18px 0 12px;">
    <h3>Dudas sobre este procedimiento</h3>
    ${renderComentariosLista(p.id)}

      <label>Agregar duda (algo que no te quedó claro del procedimiento)</label>
      <textarea id="nuevoComentarioTexto" placeholder="Escribe aquí tu duda..."></textarea>
      <label>Correo corporativo (ahí te llegará la respuesta)</label>

        <button class="btn-primary" onclick="agregarComentario('${p.id}')">Enviar duda</button>
      </div>
    ` : `<p class="note">Identifícate para poder enviar una duda.</p>`}
  `, true);
}

function renderComentariosLista(procId){
  const coments = loadComentarios().filter(c => c.procedureId === procId)
    .sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  if (coments.length === 0) return `<p class="note">Aún no hay dudas registradas.</p>`;
  return coments.map(c => `
    <div style="border:1px solid var(--borde); border-radius:8px; padding:10px 12px; margin-bottom:8px;">
      <div class="meta"><b style="color:#1c2530;">${escapeHtml(c.nombre)}</b>${c.cargo ? ' · '+escapeHtml(c.cargo) : ''}${c.puntoVenta ? ' · '+escapeHtml(c.puntoVenta) : ''} · ${fmtDate(c.fecha)}
        <span class="badge ${c.resuelto ? 'ok':'pend'}">${c.resuelto ? 'Resuelto' : 'Pendiente'}</span>
      </div>
      <div style="margin-top:4px;">${escapeHtml(c.texto)}</div>
      ${c.respuesta ? `<div style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--borde);"><span class="meta"><b>Respuesta de Inventarios</b> · ${fmtDate(c.respuestaFecha)}</span><div>${escapeHtml(c.respuesta)}</div></div>` : ''}
    </div>
  `).join('');
}

function agregarComentario(procId){
  if (!state.user){ openLogin(); return; }
  const texto = document.getElementById('nuevoComentarioTexto').value.trim();
  const correo = document.getElementById('nuevoComentarioCorreo').value.trim();
  if (!texto){ alert("Escribe la duda antes de enviarla."); return; }
  if (!correo || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)){ alert("Escribe un correo corporativo válido — ahí te llegará la respuesta."); return; }
  const p = loadProcs().find(x => x.id === procId);
  const coments = loadComentarios();
  coments.push({
    id: uid(),
    procedureId: procId,
    procedureTitulo: p.titulo,
    nombre: state.user.nombre,
    cargo: state.user.cargo || '',
    puntoVenta: state.user.puntoVenta || '',
    correo,
    texto,
    fecha: new Date().toISOString(),
    resuelto: false,
    respuesta: '',
    respuestaFecha: ''
  });
  saveComentarios(coments);
  state.user.correo = correo;
  saveUser(state.user);
  openLeer(procId);
}

function descargarProc(id){
  const p = loadProcs().find(x => x.id === id);
  if (p.archivoDataURL){
    const a = document.createElement('a');
    a.href = p.archivoDataURL;
    a.download = p.archivoNombre || (p.titulo + '.pdf');
    a.click();
    return;
  }
  const texto = `${p.titulo}\nCategoría: ${p.categoria} · Versión: ${p.version}\nPublicado: ${fmtDate(p.fechaPublicacion)}\n\n${p.contenido}\n${p.urlExterno ? '\nEnlace original: '+p.urlExterno : ''}`;
  const blob = new Blob([texto], {type: 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = p.titulo.replace(/[^a-z0-9]+/gi,'_') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function initSigPad(){
  const canvas = document.getElementById('sigPad');
  if (!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#16396b';
  sigEmpty = true;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x: cx, y: cy};
  }
  function start(e){ drawing = true; sigEmpty = false; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }

  canvas.onmousedown = start; canvas.onmousemove = move; window.addEventListener('mouseup', end);
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}

function clearSig(){
  const canvas = document.getElementById('sigPad');
  const ratio = window.devicePixelRatio || 1;
  sigCtx.clearRect(0,0,canvas.width/ratio, canvas.height/ratio);
  sigEmpty = true;
}

function guardarFirma(procId){
  const declaro = document.getElementById('declaro').checked;
  const nombre = document.getElementById('firmaNombre').value.trim();

  if (!numDoc){ alert("Escribe el número de documento."); return; }
  if (!puntoVenta){ alert("Selecciona el punto de venta."); return; }
  if (sigEmpty){ alert("Falta dibujar la firma en el recuadro."); return; }

  const canvas = document.getElementById('sigPad');
  const firmaDataURL = canvas.toDataURL('image/png');
  const p = loadProcs().find(x => x.id === procId);

  sigs.push({

function handleArchivosMasivos(e){
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;
  const categoria = document.getElementById('nCategoriaMasiva').value.trim() || 'General';
  const notaEl = document.getElementById('masivaNota');
  notaEl.innerHTML = `Procesando ${files.length} archivo(s)...`;

  let pendientes = files.length;
  const creados = [];
  const rechazados = [];

  function finalizarMasiva(){
    let html = '';
    if (creados.length) html += `Se publicaron ${creados.length} procedimiento(s): ${creados.map(escapeHtml).join(', ')}.`;
    if (rechazados.length) html += `<br><span style="color:var(--rojo)">No se cargaron (muy pesados, límite ~2MB): ${rechazados.map(escapeHtml).join(', ')}.</span>`;
    if (creados.length) html += `<br>Ve a la pestaña "Procedimientos" para revisar cada uno o agregarle destinatarios.`;
    notaEl.innerHTML = html || 'No se publicó ningún archivo.';
    e.target.value = '';
    if (creados.length) renderMain();
  }

  files.forEach(file => {
    if (file.size > 2*1024*1024){
      rechazados.push(file.name);
      pendientes--;
      if (pendientes === 0) finalizarMasiva();
      return;
    }
    const esTexto = /\.(txt|md)$/i.test(file.name);
    const readerData = new FileReader();
    readerData.onload = () => {
      const info = guessMetaFromFilename(file.name);
      const crearProc = (contenidoTexto, infoExtra) => {
        const meta = Object.assign({}, info, infoExtra || {});
        const procs = loadProcs();
        procs.unshift({
          id: uid(),
          titulo: meta.titulo || file.name.replace(/\.[^/.]+$/, ''),
          categoria,
          version: meta.version || '1.0',
          fechaDocumento: meta.fecha || '',
          fechaPublicacion: new Date().toISOString(),
          vigenciaHasta: '',
          contenido: contenidoTexto || '',
          archivoDataURL: readerData.result,
          archivoNombre: file.name,
          urlExterno: '',
          destinatarios: [],
          publicadoPor: state.user.nombre + " (Inventarios)"
        });
        saveProcs(procs);
        creados.push(file.name);
        pendientes--;
        if (pendientes === 0) finalizarMasiva();
      };

      if (esTexto){
        const readerTxt = new FileReader();
        readerTxt.onload = () => crearProc(readerTxt.result, scanTextoParaMeta(readerTxt.result));
        readerTxt.readAsText(file);
      } else {
        crearProc('');
      }
    };
    readerData.readAsDataURL(file);
  });
}

/* Intenta adivinar título/versión/fecha a partir del nombre del archivo */
function guessMetaFromFilename(filename){
  let base = filename.replace(/\.[^/.]+$/, '');

  let version = null;
  const vMatch = base.match(/v(?:ersi[oó]n)?[\s._-]*?(\d+(?:[.,]\d+)?)/i);
  if (vMatch) version = vMatch[1].replace(',', '.');

  let fecha = null;
  let m = base.match(/(20\d{2})[-_.](\d{1,2})[-_.](\d{1,2})/);
  if (m) {
    fecha = `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  } else if (m = base.match(/(\d{1,2})[-_.](\d{1,2})[-_.](20\d{2})/)) {
    fecha = `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  }

  let titulo = base;
  if (vMatch) titulo = titulo.replace(vMatch[0], '');
  titulo = titulo
    .replace(/(20\d{2})[-_.](\d{1,2})[-_.](\d{1,2})/, '')
    .replace(/(\d{1,2})[-_.](\d{1,2})[-_.](20\d{2})/, '')
    .replace(/[_\-]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  titulo = titulo.replace(/\b\w/g, c => c.toUpperCase());

  return { titulo, version, fecha };
}

/* Para archivos de texto (.txt/.md) busca pistas de versión/fecha/título dentro del contenido */
function scanTextoParaMeta(texto){
  const out = {};
  let m;
  if (m = texto.match(/versi[oó]n[:\s]+([\d.,]+)/i)) out.version = m[1].replace(',', '.');
  if (m = texto.match(/fecha[:\s]+(\d{4}-\d{1,2}-\d{1,2})/i)) {
    out.fecha = m[1];
  } else if (m = texto.match(/fecha[:\s]+(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/i)) {
    out.fecha = `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  }
  const primeraLinea = texto.split('\n').map(l => l.trim()).find(l => l.length > 3 && l.length < 120);
  if (primeraLinea) out.titulo = primeraLinea.replace(/^#+\s*/, '');
  return out;
}

function aplicarMetaDetectada(info, file, extra){
  const campoTitulo = document.getElementById('nTitulo');
  const campoVersion = document.getElementById('nVersion');
  const campoFechaDoc = document.getElementById('nFechaDoc');
  const detectados = [];
  if (info.titulo && campoTitulo && !campoTitulo.value.trim()) { campoTitulo.value = info.titulo; detectados.push('título'); }
  if (info.version && campoVersion) { campoVersion.value = info.version; detectados.push('versión'); }
  if (info.fecha && campoFechaDoc) { campoFechaDoc.value = info.fecha; detectados.push('fecha'); }
  const nota = document.getElementById('archivoNota');
  nota.innerHTML = `Archivo cargado: ${escapeHtml(file.name)}` +
    (detectados.length ? `<br><span style="color:var(--azul-osc); font-weight:600;">Se detectó automáticamente: ${detectados.join(', ')}. Revísalo antes de publicar.</span>` : '') +
    (extra || '');
}

function handleArchivo(e){
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2*1024*1024){
    document.getElementById('archivoNota').innerHTML = `<span style="color:var(--rojo)">Archivo muy grande para este prototipo (límite ~2MB). Usa el enlace externo en su lugar.</span>`;
    e.target.value = '';
    return;
  }

  const esTexto = /\.(txt|md)$/i.test(file.name);
  const readerData = new FileReader();
  readerData.onload = () => {
    tempArchivo = { nombre: file.name, dataURL: readerData.result };
    const info = guessMetaFromFilename(file.name);

    if (esTexto){
      const readerTxt = new FileReader();
      readerTxt.onload = () => {
        const texto = readerTxt.result;
        const infoTexto = scanTextoParaMeta(texto);
        aplicarMetaDetectada(Object.assign({}, info, infoTexto), file);
        const campoContenido = document.getElementById('nContenido');
        if (campoContenido && !campoContenido.value.trim()) campoContenido.value = texto;
      };
      readerTxt.readAsText(file);
    } else {
      aplicarMetaDetectada(info, file,
        `<div class="note">Para PDF/Word este prototipo no puede leer el texto interno, así que el título/versión/fecha se detectan solo del nombre del archivo. Puedes pegar el contenido en el cuadro de texto o ajustar los campos manualmente.</div>`);
    }
  };
  readerData.readAsDataURL(file);
}

function addDest(){
  const input = document.getElementById('nDestInput');
  const v = input.value.trim();
  if (!v) return;
  tempDestinatarios.push(v);
  input.value = '';
  renderDestTags();
}
function removeDest(i){ tempDestinatarios.splice(i,1); renderDestTags(); }
function renderDestTags(){
  document.getElementById('destTags').innerHTML = tempDestinatarios.map((d,i) =>
    `<span class="tag">${escapeHtml(d)} <button onclick="removeDest(${i})">✕</button></span>`
  ).join('');
}

function publicarProc(){
  const titulo = document.getElementById('nTitulo').value.trim();
  const categoria = document.getElementById('nCategoria').value.trim() || "General";
  const version = document.getElementById('nVersion').value.trim() || "1.0";
  const fechaDocumento = document.getElementById('nFechaDoc').value;
  const vigencia = document.getElementById('nVigencia').value;
  const contenido = document.getElementById('nContenido').value.trim();
  const url = document.getElementById('nUrl').value.trim();
  if (!titulo){ alert("El título es obligatorio."); return; }
  if (!contenido && !tempArchivo && !url){ alert("Agrega contenido, un archivo o un enlace."); return; }

  const procs = loadProcs();
  procs.unshift({
    id: uid(),
    titulo, categoria, version,
    fechaDocumento,
    fechaPublicacion: new Date().toISOString(),
    vigenciaHasta: vigencia,
    contenido,
    archivoDataURL: tempArchivo ? tempArchivo.dataURL : "",
    archivoNombre: tempArchivo ? tempArchivo.nombre : "",
    urlExterno: url,
    destinatarios: [...tempDestinatarios],
    publicadoPor: state.user.nombre + " (Inventarios)"
  });
  saveProcs(procs);
  alert("Procedimiento publicado.");
  state.tab = "procedimientos";
  render();
}

/* ---------- Vista: Cumplimiento (admin) ---------- */
function viewCumplimiento(){
  if (!isAdmin()) return `<div class="card"><div class="empty">Vista solo para Administrador (Inventarios).</div></div>`;
  const procs = loadProcs();
  const sigs = loadSigs();
  if (procs.length === 0) return `<div class="card"><div class="empty">No hay procedimientos.</div></div>`;

  const rows = procs.map(p => {
    const firmasProc = sigs.filter(s => s.procedureId === p.id);
    const firmantes = new Set(firmasProc.map(s => s.nombre.toLowerCase()));
    const esperados = p.destinatarios || [];
    const pendientes = esperados.filter(d => !firmantes.has(d.toLowerCase()));
    const cumplimiento = esperados.length ? Math.round(((esperados.length - pendientes.length) / esperados.length) * 100) : null;

    return `
      <div class="card">
        <h3>${escapeHtml(p.titulo)} <span class="meta">(v${escapeHtml(p.version)})</span></h3>
        <div class="stat">
          <div class="box"><b>${firmasProc.length}</b><span>Firmas recibidas</span></div>
          <div class="box"><b>${esperados.length}</b><span>Destinatarios esperados</span></div>
          <div class="box"><b>${cumplimiento === null ? '—' : cumplimiento+'%'}</b><span>% cumplimiento</span></div>
        </div>
        ${esperados.length ? `
          <table>
            <thead><tr><th>Destinatario</th><th>Estado</th><th>Fecha de firma</th></tr></thead>
            <tbody>
              ${esperados.map(d => {
                const s = firmasProc.find(x => x.nombre.toLowerCase() === d.toLowerCase());
                return `<tr>
                  <td>${escapeHtml(d)}</td>
                  <td>${s ? '<span class="badge ok">Firmado</span>' : '<span class="badge pend">Pendiente</span>'}</td>
                  <td>${s ? fmtDate(s.fecha) : '—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>` : `<p class="note">No se definieron destinatarios esperados para este procedimiento.</p>`}

        ${renderResumenPorCampo(firmasProc, 'puntoVenta', 'Punto de venta')}
        ${renderResumenPorCampo(firmasProc, 'cargo', 'Cargo')}

        <div class="row-end">
          <button class="btn-secondary" onclick="descargarActaPDF('${p.id}')">Descargar acta de asistencia (PDF)</button>
        </div>
      </div>`;
  }).join('');

  return rows;
}

/* Agrupa las firmas de un procedimiento por un campo (puntoVenta o cargo) y arma una tabla resumen */
function renderResumenPorCampo(firmasProc, campo, etiqueta){
  if (firmasProc.length === 0){
    return `<h3 style="margin-top:16px;">Firmas por ${etiqueta.toLowerCase()}</h3><p class="note">Aún no hay firmas registradas.</p>`;
  }
  const grupos = {};
  firmasProc.forEach(s => {
    const key = s[campo] || '—';
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(s.nombre);
  });
  const filas = Object.keys(grupos).sort().map(key => `
    <tr>
      <td>${escapeHtml(key)}</td>
      <td>${grupos[key].length}</td>
      <td class="meta">${grupos[key].map(escapeHtml).join(', ')}</td>
    </tr>
  `).join('');
  return `
    <h3 style="margin-top:16px;">Firmas por ${etiqueta.toLowerCase()}</h3>
    <table>
      <thead><tr><th>${etiqueta}</th><th>Firmantes</th><th>Personas</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
  `;
}

/* ---------- Acta de asistencia (PDF vía impresión del navegador) ---------- */
function descargarActaPDF(procId){
  const p = loadProcs().find(x => x.id === procId);
  const sigs = loadSigs().filter(s => s.procedureId === procId).sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
  if (sigs.length === 0){ alert("Todavía no hay firmas registradas para este procedimiento."); return; }

  const filas = sigs.map((s,i) => `
    <tr>
      <td style="text-align:center;">${i+1}</td>
      <td>${escapeHtml(s.numDoc || '—')}</td>
      <td>${escapeHtml(s.nombre)}</td>
      <td>${escapeHtml(s.cargo || '—')}</td>
      <td>${escapeHtml(s.puntoVenta || '—')}</td>
      <td style="text-align:center;"><img src="${s.firmaDataURL}" style="height:32px; max-width:110px;"></td>
    </tr>
  `).join('');

  document.getElementById('areaImprimir').innerHTML = `
    <div style="font-family: Arial, Helvetica, sans-serif; color:#111; padding:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid #1C8E85; padding-bottom:10px; margin-bottom:14px;">
        <img src="${BBC_LOGO_B64}" style="height:42px;">
        <div style="text-align:right; font-size:11px; color:#444;">
          <div><b>FGCCP002</b> · LISTADO DE ASISTENCIA</div>
          <div>Versión 1</div>
        </div>
      </div>
      <table style="width:100%; font-size:12px; margin-bottom:12px;">
        <tr>
          <td><b>FECHA:</b> ${fmtDate(new Date().toISOString())}</td>
          <td style="text-align:right;"><b>TOTAL PARTICIPANTES:</b> ${sigs.length}</td>
        </tr>
        <tr><td colspan="2"><b>TEMA:</b> ${escapeHtml(p.titulo)} (v${escapeHtml(p.version)})</td></tr>
      </table>
      <table style="width:100%; border-collapse:collapse; font-size:11px;" border="1" cellpadding="5">
        <thead>
          <tr style="background:#1C8E85; color:#fff;">
            <th>N°</th><th>CÉDULA</th><th>NOMBRES Y APELLIDOS</th><th>CARGO</th><th>ÁREA / PUNTO</th><th>FIRMA</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
      <p style="font-size:11px; margin-top:16px;"><b>OBSERVACIONES:</b> Documento generado automáticamente por la Plataforma de Procedimientos — Temple Colombia. La firma es la captura digital registrada por cada persona al confirmar la lectura del procedimiento.</p>
    </div>
  `;
  window.print();
}

/* ---------- Vista: Historial de firmas (admin) — evidencia para casos de incumplimiento ---------- */
function viewHistorial(){
  if (!isAdmin()) return `<div class="card"><div class="empty">Vista solo para Administrador (Inventarios).</div></div>`;
  const sigs = loadSigs().slice().sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

  return `
    <div class="card">
      <h2>Historial de firmas (soporte / evidencia)</h2>
      <p class="note">Busca por nombre de la persona para verificar si firmó el recibido de un procedimiento específico, con fecha, hora y firma manuscrita como soporte.</p>
      <div class="toolbar">
        <input type="text" id="buscarFirma" placeholder="Buscar por nombre..." oninput="renderTablaFirmas()">
        <button class="btn-ghost" onclick="exportarCSV()">Exportar CSV</button>
      </div>
      <div id="tablaFirmas"></div>
    </div>
  `;
}

function renderTablaFirmas(){
  const cont = document.getElementById('tablaFirmas');
  if (!cont) return;
  const q = (document.getElementById('buscarFirma').value || '').toLowerCase();
  let sigs = loadSigs().slice().sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  if (q) sigs = sigs.filter(s => s.nombre.toLowerCase().includes(q) || s.procedureTitulo.toLowerCase().includes(q));

  if (sigs.length === 0){ cont.innerHTML = `<div class="empty">Sin resultados.</div>`; return; }

  cont.innerHTML = `
    <table>
      <thead><tr><th>Persona</th><th>Tipo doc.</th><th>N° documento</th><th>Cargo</th><th>Punto de venta</th><th>Procedimiento</th><th>Fecha y hora</th><th>Firma</th></tr></thead>
      <tbody>
        ${sigs.map(s => `
          <tr>
            <td>${escapeHtml(s.nombre)}</td>
            <td>${escapeHtml(s.tipoDoc||'—')}</td>
            <td>${escapeHtml(s.numDoc||'—')}</td>
            <td>${escapeHtml(s.cargo)}</td>
            <td>${escapeHtml(s.puntoVenta||'—')}</td>
            <td>${escapeHtml(s.procedureTitulo)}</td>
            <td>${fmtDate(s.fecha)}</td>
            <td><img class="sig-thumb" src="${s.firmaDataURL}" onclick="verFirmaGrande('${s.id}')"></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function verFirmaGrande(id){
  const s = loadSigs().find(x => x.id === id);
  showModal(`
    <h2>Soporte de firma</h2>
    <p><b>${escapeHtml(s.nombre)}</b> — ${escapeHtml(s.cargo)} ${s.puntoVenta ? '· '+escapeHtml(s.puntoVenta) : ''}</p>
    <p class="meta">${escapeHtml(s.tipoDoc||'')} N° ${escapeHtml(s.numDoc||'—')}<br>Procedimiento: ${escapeHtml(s.procedureTitulo)}<br>Fecha y hora: ${fmtDate(s.fecha)}<br>Declaración: confirmó haber leído y entendido el procedimiento.</p>
    <div style="border:1px solid var(--borde); border-radius:8px; padding:10px; background:#fff;">
      <img src="${s.firmaDataURL}" style="width:100%;">
    </div>
    <div class="row-end"><button class="btn-primary" onclick="closeModal()">Cerrar</button></div>
  `);
}

function exportarCSV(){
  const sigs = loadSigs();
  const header = ['Nombre','Tipo_documento','Numero_documento','Cargo','Punto_de_venta','Procedimiento','Fecha_ISO'];
  const rows = sigs.map(s => [s.nombre, s.tipoDoc, s.numDoc, s.cargo, s.puntoVenta, s.procedureTitulo, s.fecha]);
  const csv = [header, ...rows].map(r => r.map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'historial_firmas.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Vista: Comentarios (admin) ---------- */
function viewComentarios(){
  if (!isAdmin()) return `<div class="card"><div class="empty">Vista solo para Administrador (Inventarios).</div></div>`;
  const coments = loadComentarios();
  const pendientes = coments.filter(c => !c.resuelto).length;
  return `
    <div class="card">
      <h2>Dudas de los procedimientos</h2>
      <div class="stat">
        <div class="box"><b>${coments.length}</b><span>Total</span></div>
        <div class="box"><b>${pendientes}</b><span>Pendientes</span></div>
      </div>
      <div class="toolbar">
        <select id="filtroComentarios" onchange="renderTablaComentarios()">
          <option value="todos">Todos</option>
          <option value="pendientes">Solo pendientes</option>
          <option value="resueltos">Solo resueltos</option>
        </select>
        <input type="text" id="buscarComentario" placeholder="Buscar por persona o procedimiento..." oninput="renderTablaComentarios()">
      </div>
      <div id="listaComentariosAdmin"></div>
    </div>
  `;
}

function renderTablaComentarios(){
  const cont = document.getElementById('listaComentariosAdmin');
  if (!cont) return;
  const filtro = document.getElementById('filtroComentarios').value;
  const q = (document.getElementById('buscarComentario').value || '').toLowerCase();
  let coments = loadComentarios().slice().sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  if (filtro === 'pendientes') coments = coments.filter(c => !c.resuelto);
  if (filtro === 'resueltos') coments = coments.filter(c => c.resuelto);
  if (q) coments = coments.filter(c => c.nombre.toLowerCase().includes(q) || c.procedureTitulo.toLowerCase().includes(q));

  if (coments.length === 0){ cont.innerHTML = `<div class="empty">Sin dudas que coincidan.</div>`; return; }

  cont.innerHTML = coments.map(c => `
    <div class="card" style="margin-bottom:10px;">
      <div class="meta"><b style="color:#1c2530;">${escapeHtml(c.nombre)}</b>${c.cargo ? ' · '+escapeHtml(c.cargo) : ''}${c.puntoVenta ? ' · '+escapeHtml(c.puntoVenta) : ''} · ${fmtDate(c.fecha)}
        <span class="badge ${c.resuelto ? 'ok':'pend'}">${c.resuelto ? 'Resuelto' : 'Pendiente'}</span>
      </div>
      <div class="meta">Procedimiento: ${escapeHtml(c.procedureTitulo)} ${c.correo ? '· ✉️ '+escapeHtml(c.correo) : '· <span style="color:var(--rojo)">sin correo registrado</span>'}</div>
      <div style="margin:8px 0;">${escapeHtml(c.texto)}</div>
      ${c.respuesta ? `<div style="padding:8px 10px; background:var(--gris-cl); border-radius:6px; margin-bottom:8px;"><span class="meta"><b>Tu respuesta</b> · ${fmtDate(c.respuestaFecha)}</span><div>${escapeHtml(c.respuesta)}</div></div>` : ''}
      <textarea id="resp_${c.id}" placeholder="Escribe una respuesta...">${escapeHtml(c.respuesta)}</textarea>
      <div class="actions" style="margin-top:8px;">
        <button class="btn-secondary" onclick="guardarRespuesta('${c.id}')">Guardar respuesta</button>
        <button class="btn-primary" onclick="enviarPorCorreo('${c.id}')">Enviar por correo</button>
        <button class="btn-ghost" onclick="toggleResuelto('${c.id}')">${c.resuelto ? 'Marcar pendiente' : 'Marcar resuelto'}</button>
      </div>
    </div>
  `).join('');
}

function guardarRespuesta(id){
  const coments = loadComentarios();
  const c = coments.find(x => x.id === id);
  c.respuesta = document.getElementById('resp_'+id).value.trim();
  c.respuestaFecha = new Date().toISOString();
  saveComentarios(coments);
  renderTablaComentarios();
}

/* Abre el cliente de correo del administrador (Outlook/Gmail, el que tenga configurado)
   con el mensaje ya redactado. Este prototipo no tiene un backend de correo propio,
   así que el envío real lo hace el administrador desde su propio correo. */
function enviarPorCorreo(id){
  const coments = loadComentarios();
  const c = coments.find(x => x.id === id);
  const respuesta = document.getElementById('resp_'+id).value.trim();
  if (!respuesta){ alert("Escribe la respuesta antes de enviarla por correo."); return; }
  if (!c.correo){ alert("Esta persona no dejó un correo corporativo registrado."); return; }

  c.respuesta = respuesta;
  c.respuestaFecha = new Date().toISOString();
  saveComentarios(coments);
  renderTablaComentarios();

  const asunto = encodeURIComponent('Respuesta a tu duda: ' + c.procedureTitulo);
  const cuerpo = encodeURIComponent(
    `Hola ${c.nombre},\n\nEsta es la respuesta a tu duda sobre el procedimiento "${c.procedureTitulo}":\n\n${respuesta}\n\n— Administrador (Inventarios)`
  );
  window.location.href = `mailto:${c.correo}?subject=${asunto}&body=${cuerpo}`;
}

function toggleResuelto(id){
  const coments = loadComentarios();
  const c = coments.find(x => x.id === id);
  c.resuelto = !c.resuelto;
  saveComentarios(coments);
  renderTablaComentarios();
}

/* ---------- Vista: Mis firmas (usuario) ---------- */
function viewMisFirmas(){
  if (!state.user) return `<div class="card"><div class="empty">Identifícate primero.</div></div>`;
  const sigs = loadSigs().filter(s => s.nombre.toLowerCase() === state.user.nombre.toLowerCase())
    .sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  if (sigs.length === 0) return `<div class="card"><div class="empty">Aún no has firmado ningún procedimiento.</div></div>`;
  return `
    <div class="card">
      <h2>Procedimientos que he firmado</h2>
      <table>
        <thead><tr><th>Procedimiento</th><th>Fecha y hora</th><th>Firma</th></tr></thead>
        <tbody>
          ${sigs.map(s => `
            <tr>
              <td>${escapeHtml(s.procedureTitulo)}</td>
              <td>${fmtDate(s.fecha)}</td>
              <td><img class="sig-thumb" src="${s.firmaDataURL}" onclick="verFirmaGrande('${s.id}')"></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ---------- Utilidades UI ---------- */
function showModal(html, wide){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal"${wide ? ' style="max-width:820px;"' : ''}>${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* Hook: cuando se abre historial, pintar tabla */
const origRenderMain = renderMain;
renderMain = function(){
  origRenderMain();
  if (state.tab === "historial") renderTablaFirmas();
  if (state.tab === "comentarios") renderTablaComentarios();
};

render();
if (!state.user) openLogin();
</script>
